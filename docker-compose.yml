# docker-compose.yml
# Orquestación: Traefik (proxy interno) + rmrLocationsApi (.NET) + PostgreSQL/PostGIS
#
# ARQUITECTURA DE DOBLE PROXY
# ---------------------------
#   Internet :443 ──► NGINX (host)          ← termina TLS con certificados de Certbot
#                       │  proxy_pass
#                       ▼
#                     127.0.0.1:8081 ──► Traefik (Docker)   ← enruta por Host()
#                                          │
#                                          ▼
#                                        api:8080 ──► postgres:5432
#
# Traefik NO gestiona certificados ni ocupa los puertos 80/443: esos son de NGINX.
# Su configuración estática vive en ./traefik/traefik.yaml.

services:

  # =============================================
  # Traefik — Proxy inverso INTERNO (sin TLS)
  # =============================================
  traefik:
    # Versión fijada a propósito. `:latest` hace que un `docker compose pull` pueda
    # introducir un cambio incompatible sin previo aviso: en producción se fija y se
    # actualiza de forma deliberada. Verifica el tag disponible antes de desplegar.
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    ports:
      # ⚠️ EL PREFIJO 127.0.0.1 ES LA PROTECCIÓN PRINCIPAL, NO UFW.
      # Docker inserta sus propias reglas de iptables por delante de UFW, así que
      # publicar como "8081:8081" dejaría el puerto accesible desde internet AUNQUE
      # UFW lo bloquee. Al atarlo a la loopback, el puerto no existe fuera del host.
      - "127.0.0.1:8081:8081"
    volumes:
      # Solo lectura: Traefik únicamente necesita observar contenedores, nunca crearlos.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro"
    networks:
      - traefik-public
    labels:
      # El propio Traefik no se publica a través de sí mismo.
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =============================================
  # rmrLocationsApi — API .NET
  # =============================================
  api:
    image: ghcr.io/raymondmr/rmrlocationsapi:latest    # GHCR requiere minúsculas
    container_name: rmrlocations-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Kestrel escucha HTTP en claro: el TLS lo terminó NGINX en el borde.
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=rmrLocationsApi;Username=postgres;Password=${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en el .env del VPS}
      # Sin valor por defecto A PROPÓSITO: la clave de firma JWT que había aquí está
      # publicada en el repositorio. Cualquiera que la conozca puede fabricar tokens
      # de administrador válidos. Debe ser un secreto único generado en el servidor.
      - AppSettings__Token=${JWT_TOKEN:?define JWT_TOKEN en el .env del VPS - generar con openssl rand -base64 64}
      - AppSettings__Issuer=${JWT_ISSUER:-rmrLocationsApi}
      - AppSettings__Audience=${JWT_AUDIENCE:-rmrLocationsApi}
    networks:
      - traefik-public
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Router de la API. Sin TLS: NGINX ya descifró la petición antes de llegar aquí.
      - "traefik.http.routers.rmrlocations-api.rule=Host(`api.${DOMAIN:?define DOMAIN en el .env del VPS, ej. DOMAIN=rmrlocations.com}`)"
      - "traefik.http.routers.rmrlocations-api.entrypoints=web"
      # Puerto interno del contenedor
      - "traefik.http.services.rmrlocations-api.loadbalancer.server.port=8080"
      #
      # Las cabeceras de seguridad (HSTS, X-Frame-Options, nosniff, Referrer-Policy)
      # se aplican ahora en NGINX, la capa que termina el TLS. Definirlas también aquí
      # produciría cabeceras duplicadas en la respuesta.

  # =============================================
  # PostgreSQL + PostGIS — Base de datos
  # =============================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rmrlocations-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=rmrLocationsApi
      - POSTGRES_USER=postgres
      # ⚠️ Si cambias esta contraseña DESPUÉS de que el volumen ya exista, PostgreSQL
      # seguirá usando la que tenía al inicializarse y la API no podrá conectar.
      # Ver la sección "Trampa de la contraseña" en Refactor_to_NGINX_+_Traefik_Docker.md.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en el .env del VPS}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      # Solo en la red interna: la base de datos NUNCA es alcanzable desde Traefik,
      # NGINX ni internet. Únicamente el contenedor `api` la ve.
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rmrLocationsApi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# =============================================
# REDES
# =============================================
networks:
  traefik-public:
    name: traefik-public
    external: false
  internal:
    name: rmrlocations-internal
    external: false

# =============================================
# VOLÚMENES
# =============================================
# El volumen `traefik-certificates` desapareció: Traefik ya no almacena acme.json.
# Los certificados viven ahora en /etc/letsencrypt del host, gestionados por Certbot.
volumes:
  postgres-data:
    name: rmrlocations-postgres-data
