# deploy/nginx/api.rmrlocations.com.conf
#
# CONFIGURACIÓN DEFINITIVA — instalar SOLO después de que Certbot haya emitido
# el certificado (ver Refactor_to_NGINX_+_Traefik_Docker.md, Fase 2).
#
# Destino: /etc/nginx/sites-available/api.rmrlocations.com.conf
#          enlazado desde /etc/nginx/sites-enabled/
#
# Flujo:  Internet :443 → [este bloque] → 127.0.0.1:8081 (Traefik) → api:8080

# ---------------------------------------------------------------------------
# Puerto 80 — únicamente desafío ACME y redirección a HTTPS
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen [::]:80;
    server_name api.rmrlocations.com;

    # Debe seguir existiendo DESPUÉS de tener certificado: las renovaciones
    # automáticas de Certbot vuelven a usar esta ruta cada 60 días.
    # Va ANTES de la redirección para que el desafío no acabe redirigido a HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Puerto 443 — terminación TLS y proxy hacia Traefik
# ---------------------------------------------------------------------------
server {
    # HTTP/2 se activa en el propio `listen` porque NGINX 1.24 (el de Ubuntu 24.04)
    # todavía no admite la directiva `http2 on;`, introducida en 1.25.1.
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rmrlocations.com;

    # -----------------------------------------------------------------------
    # Certificados (gestionados por Certbot; NO editar estas rutas a mano)
    # -----------------------------------------------------------------------
    ssl_certificate         /etc/letsencrypt/live/api.rmrlocations.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/api.rmrlocations.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.rmrlocations.com/chain.pem;

    # -----------------------------------------------------------------------
    # Parámetros TLS — perfil "intermediate" de Mozilla
    # -----------------------------------------------------------------------
    # Se declaran explícitamente en lugar de incluir options-ssl-nginx.conf porque
    # ese archivo lo aporta el plugin certbot-nginx, que aquí no instalamos (usamos
    # webroot). Así la configuración es autocontenida y auditable.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:MozSSL:10m;
    ssl_session_tickets       off;

    # OCSP stapling: DESACTIVADO a propósito.
    # Let's Encrypt dejó de incluir la URL del respondedor OCSP en sus certificados,
    # así que `ssl_stapling on` no tiene efecto y NGINX emite un warning en cada
    # recarga. La revocación se comprueba hoy mediante CRL del lado del navegador.

    # -----------------------------------------------------------------------
    # Cabeceras de seguridad
    # -----------------------------------------------------------------------
    # `always` hace que se envíen también en respuestas de error (4xx/5xx).
    #
    # HSTS sin includeSubDomains ni preload: rmrlocations.com alojará otras
    # aplicaciones más adelante y no conviene imponerles HTTPS obligatorio desde aquí.
    add_header Strict-Transport-Security "max-age=31536000"                 always;
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;

    # Oculta la versión exacta de NGINX en respuestas y páginas de error.
    server_tokens off;

    # Tamaño máximo de subida. La API acepta media (fotos de localizaciones);
    # el valor por defecto de NGINX (1 MB) rechazaría cualquier imagen de móvil.
    client_max_body_size 25M;

    # -----------------------------------------------------------------------
    # Proxy hacia Traefik
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # --- Cabeceras OBLIGATORIAS para preservar la identidad del cliente ---
        # Sin ellas, Traefik y la API verían todas las peticiones como procedentes
        # de la loopback, lo que rompería logs, rate limiting y auditoría.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # X-Forwarded-Proto es la que permite a ASP.NET Core saber que la petición
        # original fue HTTPS, pese a llegarle en claro. Sin ella, cualquier URL
        # absoluta que genere la API saldría con http:// y provocaría contenido mixto.

        # WebSockets / SSE, por si alguna aplicación futura los necesita.
        # $connection_upgrade lo define deploy/nginx/10-websocket-upgrade.conf
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    access_log /var/log/nginx/api.rmrlocations.com.access.log;
    error_log  /var/log/nginx/api.rmrlocations.com.error.log warn;
}
