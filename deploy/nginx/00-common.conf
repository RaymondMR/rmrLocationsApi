# deploy/nginx/00-common.conf
#
# Configuración compartida por todos los sitios del VPS.
# Destino: /etc/nginx/conf.d/00-common.conf
#
# Va en conf.d/ (no en sites-available/) porque el `map` debe existir en el contexto
# `http`, antes de que cualquier bloque `server` lo use. Ubuntu incluye conf.d/*.conf
# antes que sites-enabled/*, así que el orden queda garantizado.

# ---------------------------------------------------------------------------
# Soporte de WebSockets
# ---------------------------------------------------------------------------
# Traduce la cabecera Upgrade del cliente al valor correcto de Connection:
#   petición WebSocket   → Connection: upgrade
#   petición HTTP normal → Connection: close
# Sin este map, usar `proxy_set_header Connection $connection_upgrade` da error de
# variable indefinida y NGINX no arranca.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Servidor por defecto — rechaza peticiones con Host desconocido
# ---------------------------------------------------------------------------
# Sin esto, cualquier dominio ajeno que alguien apunte a tu IP acabaría servido por
# el primer bloque `server` definido, y los escáneres automáticos que sondean por IP
# recibirían respuesta de tu API.
#
# 444 es un código no estándar de NGINX: cierra la conexión sin enviar nada. Es la
# respuesta más barata posible y no revela información a quien sondea.
#
# ⚠️ Antes de aplicarlo hay que eliminar el sitio por defecto de Ubuntu:
#     sudo rm /etc/nginx/sites-enabled/default
#   Si no, habrá dos `default_server` en el puerto 80 y NGINX se negará a arrancar.
server {
    listen      80  default_server;
    listen [::]:80  default_server;
    server_name _;
    return 444;
}
