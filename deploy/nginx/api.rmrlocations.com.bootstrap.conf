# deploy/nginx/api.rmrlocations.com.bootstrap.conf
#
# ⚠️ CONFIGURACIÓN TEMPORAL — SOLO PARA EMITIR EL PRIMER CERTIFICADO
#
# Problema del huevo y la gallina: la configuración definitiva referencia archivos
# de certificado en /etc/letsencrypt/live/... que todavía NO EXISTEN. NGINX se niega
# a arrancar si apunta a un certificado inexistente, y Certbot (con webroot) necesita
# que NGINX esté arrancado para responder al desafío. Bloqueo mutuo.
#
# Se rompe en dos fases:
#   FASE 1 (este archivo): NGINX solo en el puerto 80, sirviendo el desafío ACME.
#   FASE 2: una vez emitido el certificado, se sustituye por api.rmrlocations.com.conf
#
# Destino: /etc/nginx/sites-available/api.rmrlocations.com.conf

server {
    listen      80;
    listen [::]:80;
    server_name api.rmrlocations.com;

    # Desafío ACME de Certbot (método webroot).
    # `^~` da prioridad a este prefijo sobre cualquier regex, para que el desafío
    # nunca sea capturado por otra regla.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # En la fase 1 todavía no hay HTTPS al que redirigir.
    location / {
        add_header Content-Type text/plain;
        return 200 "Bootstrap NGINX activo. Pendiente de emitir certificado.\n";
    }
}
